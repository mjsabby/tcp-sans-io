name: perf-bench

# Performance benchmark workflow.
#
# Runs the same-path benchmark (bindings/netem/bench.sh): tcp-sans-io and
# Linux TCP Reno / CUBIC cross the identical netem-shaped router to the same
# kernel peer, so the comparison is apples-to-apples. Also captures perf
# flamegraphs and eBPF uprobe traces. All artifacts are uploaded for
# offline inspection.
#
# Triggers: manual (workflow_dispatch) and on PRs that touch the
# performance-sensitive code paths.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "bench.sh profile (lan | wan | wan-0.1 | wan-1 | metro-0.1 | lossy-5 | shallow)"
        default: "wan-0.1"
        type: string
  pull_request:
    paths:
      - "src/**"
      - "bindings/netem/**"
      - "bindings/bpf/**"
      - ".github/workflows/perf-bench.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"

permissions:
  contents: read

concurrency:
  group: perf-bench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf-bench:
    name: perf + bpftrace + same-path kernel baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true

      - name: Install perf + bpftrace + bcc-tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # Generic tools always installable; the exact-kernel package is
          # best-effort because GitHub-hosted runners can run a kernel
          # version whose tools package isn't yet published.
          sudo apt-get install -y --no-install-recommends \
            linux-tools-common linux-tools-generic \
            bpftrace bpfcc-tools \
            iproute2 ethtool jq
          sudo apt-get install -y --no-install-recommends \
            "linux-tools-$(uname -r)" || \
            echo "::warning::exact linux-tools-$(uname -r) unavailable; will fall back to generic"

          # Locate perf (the generic package installs it under
          # /usr/lib/linux-tools/<KVER>/) and symlink for $PATH lookup.
          KVER=$(uname -r)
          if ! command -v perf >/dev/null; then
            for p in "/usr/lib/linux-tools/$KVER/perf" /usr/lib/linux-tools-*/perf; do
              if [[ -x "$p" ]]; then
                sudo ln -sf "$p" /usr/local/bin/perf
                break
              fi
            done
          fi
          perf --version || echo "::warning::perf not available — flamegraph step will skip"

          # Best-effort permission relaxation for perf record + uprobes.
          sudo sysctl -w kernel.perf_event_paranoid=1 >/dev/null 2>&1 || true
          sudo sysctl -w kernel.kptr_restrict=0 >/dev/null 2>&1 || true
          # tracefs is normally mounted at /sys/kernel/tracing on modern
          # Ubuntu; mount it if missing.
          if [[ ! -d /sys/kernel/tracing/events ]]; then
            sudo mount -t tracefs nodev /sys/kernel/tracing 2>/dev/null || true
          fi

          # bpftrace smoke test — if it can't run a trivial probe, the
          # uprobe step below will skip with an explanatory artifact.
          sudo bpftrace -e 'BEGIN { exit(); }' \
            && echo "BPFTRACE_OK=1" >> "$GITHUB_ENV" \
            || echo "::warning::bpftrace unavailable on this runner"

      - name: Cache inferno binaries
        id: cache-inferno
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/inferno-collapse-perf
            ~/.cargo/bin/inferno-flamegraph
          key: inferno-${{ runner.os }}-v0.12

      - name: Install inferno (flamegraph renderer)
        if: steps.cache-inferno.outputs.cache-hit != 'true'
        run: cargo install --locked inferno --version '^0.12'

      # Build with frame pointers so perf --call-graph=fp can unwind cleanly
      # without needing libunwind / DWARF info. Slight code-size cost, no
      # measurable throughput hit for our use case.
      - name: Build cdylib (release + frame pointers)
        env:
          RUSTFLAGS: "-C force-frame-pointers=yes"
        run: cargo build --release --lib --verbose

      - name: Build benchmark endpoint
        run: |
          cd bindings/netem
          go build -o tsbench .

      - name: Determine + validate benchmark profile
        id: profile
        run: |
          set -euo pipefail
          PROFILE="${{ github.event.inputs.profile }}"
          if [[ -z "$PROFILE" ]]; then
            PROFILE="wan-0.1"
          fi
          # Whitelist — must match a profile in bench.sh.
          case "$PROFILE" in
            lan|wan|wan-0.1|wan-1|metro-0.1|lossy-5|shallow) ;;
            *) echo "::error::unknown profile: $PROFILE"; exit 1 ;;
          esac
          echo "name=$PROFILE" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/artifacts"

      # ---------------------------------------------------------------
      # 1. Same-path comparison: tcp-sans-io vs Linux Reno / CUBIC,
      #    both directions, 3 runs each (no perf overhead).
      # ---------------------------------------------------------------
      - name: Run same-path benchmark
        run: |
          set -o pipefail
          sudo bindings/netem/bench.sh --profiles "${{ steps.profile.outputs.name }}" \
            --runs 3 --stacks "tcp-sans-io reno cubic" \
            --out "$RUNNER_TEMP/artifacts/results.jsonl" \
            2>&1 | tee "$RUNNER_TEMP/artifacts/bench.log"

      # ---------------------------------------------------------------
      # 2. One tcp-sans-io upload under perf record → flamegraph.
      # ---------------------------------------------------------------
      - name: Run benchmark under perf record
        run: |
          set -o pipefail
          PERF_BIN=$(command -v perf || true)
          if [[ -z "$PERF_BIN" || ! -x "$PERF_BIN" ]]; then
            echo "::warning::perf binary missing — skipping perf record"
            exit 0
          fi
          sudo "$PERF_BIN" record \
            -F 997 --call-graph=fp \
            -o "$RUNNER_TEMP/perf.data" \
            -- bindings/netem/bench.sh --profiles "${{ steps.profile.outputs.name }}" \
              --runs 1 --dir up --stacks tcp-sans-io \
              --out "$RUNNER_TEMP/perf-results.jsonl" \
            2>&1 | tee "$RUNNER_TEMP/artifacts/perf-throughput.log" || true
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/perf.data" 2>/dev/null || true

      - name: Generate flamegraph
        run: |
          set -o pipefail
          PERF_BIN=$(command -v perf || true)
          if [[ ! -s "$RUNNER_TEMP/perf.data" ]]; then
            echo "::warning::empty or missing perf.data — skipping flamegraph"
            exit 0
          fi
          if [[ -z "$PERF_BIN" || ! -x "$PERF_BIN" ]]; then
            echo "::warning::perf binary missing — skipping flamegraph"
            exit 0
          fi
          if ! "$PERF_BIN" script -i "$RUNNER_TEMP/perf.data" \
                | inferno-collapse-perf \
                > "$RUNNER_TEMP/artifacts/folded.txt"; then
            echo "::warning::perf script | collapse-perf failed — skipping flamegraph"
            exit 0
          fi
          if [[ ! -s "$RUNNER_TEMP/artifacts/folded.txt" ]]; then
            echo "::warning::folded stack output empty — skipping flamegraph"
            exit 0
          fi
          inferno-flamegraph \
            --title "tcp-sans-io ${{ steps.profile.outputs.name }}" \
            < "$RUNNER_TEMP/artifacts/folded.txt" \
            > "$RUNNER_TEMP/artifacts/flamegraph.svg"
          inferno-flamegraph --reverse \
            --title "tcp-sans-io ${{ steps.profile.outputs.name }} (reverse)" \
            < "$RUNNER_TEMP/artifacts/folded.txt" \
            > "$RUNNER_TEMP/artifacts/flamegraph-reverse.svg"

      # ---------------------------------------------------------------
      # 3. eBPF uprobe trace via bpftrace. The Go test honours
      #    TCPSANSIO_BPF_PROFILE so the uprobe trace covers the same
      #    bench.sh profile being benchmarked.
      # ---------------------------------------------------------------
      - name: Run bpftrace uprobes against the cdylib
        if: env.BPFTRACE_OK == '1'
        env:
          TCPSANSIO_BPF_PROFILE: ${{ steps.profile.outputs.name }}
        run: |
          set -o pipefail
          cd bindings/bpf
          sudo -E env PATH=$PATH HOME=$HOME \
              TCPSANSIO_BPF_PROFILE="$TCPSANSIO_BPF_PROFILE" \
            go test -v -count=1 -timeout=180s -tags bpftrace \
              -run TestBpftraceUprobes ./... \
            2>&1 | tee "$RUNNER_TEMP/artifacts/bpftrace-test.log" || true
          if [[ -f bpftrace_uprobes.txt ]]; then
            sudo chown "$(id -u):$(id -g)" bpftrace_uprobes.txt 2>/dev/null || true
            cp bpftrace_uprobes.txt "$RUNNER_TEMP/artifacts/"
          fi

      - name: Skip-marker for bpftrace
        if: env.BPFTRACE_OK != '1'
        run: |
          echo "bpftrace unavailable on this runner; uprobe step skipped." \
            > "$RUNNER_TEMP/artifacts/bpftrace_uprobes.txt"

      # ---------------------------------------------------------------
      # 4. Render a summary into the workflow run page.
      # ---------------------------------------------------------------
      - name: Workflow summary
        if: always()
        run: |
          {
            echo "# perf-bench results: ${{ steps.profile.outputs.name }}"
            echo ""
            if [[ -s "$RUNNER_TEMP/artifacts/results.jsonl" ]]; then
              python3 bindings/netem/summarize.py "$RUNNER_TEMP/artifacts/results.jsonl"
            else
              echo "(no benchmark results captured)"
            fi
            echo ""
            echo "## bpftrace uprobe counts (tcp-sans-io FFI)"
            echo '```'
            if [[ -f "$RUNNER_TEMP/artifacts/bpftrace_uprobes.txt" ]]; then
              grep -E "^@count|^@bytes_" "$RUNNER_TEMP/artifacts/bpftrace_uprobes.txt" \
                || head -20 "$RUNNER_TEMP/artifacts/bpftrace_uprobes.txt"
            else
              echo "(no bpftrace output)"
            fi
            echo '```'
            echo ""
            echo "## Artifacts"
            echo "Download from the workflow run page:"
            echo "* \`flamegraph.svg\`, \`flamegraph-reverse.svg\` — CPU flamegraphs"
            echo "* \`bpftrace_uprobes.txt\` — uprobe latency histograms"
            echo "* \`results.jsonl\` — raw per-run results (all stacks, both directions)"
            echo "* \`folded.txt\` — folded perf stacks (for re-rendering)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-bench-${{ steps.profile.outputs.name }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: warn
          retention-days: 30
