[package]
name = "tcp-sans-io"
version = "0.1.0"
edition = "2021"
description = "Client-only sans-I/O user-space TCP stack with C ABI for WireGuard front-ends"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "tcp_sans_io"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# When enabled, the host binary supplies its own #[panic_handler]. Useful when
# this crate is linked into a larger no_std project that already defines one.
host_panic_handler = []
# Disables no_std mode entirely. Useful for fuzz harnesses (libfuzzer-sys
# pulls in std unconditionally) and any binary that's already linking std.
std = []
# Shrinks the per-direction ring buffer (BUF_CAP) from 1 MiB to 32 KiB
# so that scale harnesses can pack many Tcbs into a reasonable RSS
# (~150 KiB/Tcb vs ~2.15 MiB/Tcb). The default build is unaffected.
# Used by bindings/wgserver-rs/ for the 10000-connection stress test.
small-buffers = []
# Heap-allocate each ring buffer (`Box<[u8]>`) instead of storing it inline in
# the Tcb. Keeps `Tcb` tiny so `Box::new(Tcb::new())` builds without a multi-MiB
# stack temporary (debug builds get no return-value optimization, so an inline
# 2 MiB Tcb overflows even a 16 MiB thread stack). Requires `alloc`; leaves the
# no_std / C-FFI inline POD layout untouched when off.
heap-buffers = []

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
overflow-checks = false

[profile.dev]
panic = "abort"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"

[dev-dependencies]
proptest = "1"
smoltcp = { version = "0.13", default-features = false, features = [
    "alloc",
    "std",
    "medium-ip",
    "proto-ipv4",
    "socket-tcp",
    "log",
] }
