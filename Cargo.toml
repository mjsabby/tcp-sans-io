[package]
name = "tcp-sans-io"
version = "0.1.0"
edition = "2021"
description = "Client-only sans-I/O user-space TCP stack with C ABI for WireGuard front-ends"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "tcp_sans_io"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# When enabled, the host binary supplies its own #[panic_handler]. Useful when
# this crate is linked into a larger no_std project that already defines one.
host_panic_handler = []
# Disables no_std mode entirely. Useful for fuzz harnesses (libfuzzer-sys
# pulls in std unconditionally) and any binary that's already linking std.
std = []

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
overflow-checks = false

[profile.dev]
panic = "abort"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"

[dev-dependencies]
proptest = "1"
smoltcp = { version = "0.13", default-features = false, features = [
    "alloc",
    "std",
    "medium-ip",
    "proto-ipv4",
    "socket-tcp",
    "log",
] }
