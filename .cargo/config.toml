# Increase the default Rust thread stack size to 32 MiB.
#
# `Tcb` instances embed two `BUF_CAP`-sized rings (1 MiB each by default)
# plus a 16 KiB single-hole reassembly buffer plus the `MAX_PACKET`
# staging area plus a 24 KiB RACK send-queue plus a 48 KiB tx_ring
# (egress staging), totalling ~2.15 MiB per connection. Tests that
# instantiate multiple Tcbs (or a Tcb plus a peer-side TCP stack like
# smoltcp's `Interface` + `SocketSet`) easily blow through 16 MiB on
# debug builds with large call frames. 32 MiB is conservative; trim
# down if profiling shows memory pressure on multi-test runs.
# Production callers route through the C ABI (`tcp_init`) which writes
# into host-supplied heap storage, so this only affects tests,
# examples, and pure-Rust callers.
[env]
RUST_MIN_STACK = "33554432"
