# Increase the default Rust thread stack size to 32 MiB.
#
# A `Tcb` embeds two `BUF_CAP`-sized rings (1 MiB each by default) plus a
# 48 KiB egress ring, a 24 KiB retransmission queue and a 6 KiB out-of-order
# range tracker: ~2.08 MiB per connection. Tests that keep TCBs on the
# stack (several per test, or alongside smoltcp's `Interface` + `SocketSet`)
# easily blow through the default on debug builds with large call frames.
# Production callers go through `tcp_init` / `Tcb::init_in_place`, which
# build the TCB directly in host-supplied storage with a small stack
# footprint, so this only affects tests, examples, and pure-Rust callers
# that use `Tcb::new` by value.
[env]
RUST_MIN_STACK = "33554432"
