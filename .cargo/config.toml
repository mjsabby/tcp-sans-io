# Increase the default Rust thread stack size to 16 MiB.
#
# `Tcb` instances embed two `BUF_CAP`-sized rings (1 MiB each by default)
# plus a 16 KiB single-hole reassembly buffer plus the `MAX_PACKET`
# staging area plus a 24 KiB RACK send-queue, totalling ~2.1 MiB per
# connection. The default 1 MiB Rust (and Windows) thread stack overflows
# the moment a test or example constructs a `Tcb` as a local. Loopback
# tests that instantiate two Tcbs (peer + client) plus call frames
# can blow through even an 8 MiB stack in debug builds. Production code
# paths route through the C ABI (`tcp_init`) which writes into
# host-supplied heap storage, so this only affects tests, examples, and
# pure-Rust callers.
[env]
RUST_MIN_STACK = "16777216"
